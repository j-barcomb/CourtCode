[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "courtcode-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "courtcode_lib"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "courtcode"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.6.1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
anyhow = "1"